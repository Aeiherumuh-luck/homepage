<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f7f9fc;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom:12px;
        }
        header p {
            opacity: 0.85;
            font-size:1.1rem;
        }
        .container {
            max-width:1000px;
            margin: 0 auto;
            padding:40px 20px;
        }
        section {
            background:#fff;
            border-radius:14px;
            padding:30px;
            margin-bottom:30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        h2 {
            color:#2c3e50;
            margin-bottom:16px;
            border-left:4px solid #3498db;
            padding-left:12px;
        }
        .work-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
            gap:20px;
        }
        .work-card {
            border:1px solid #eee;
            border-radius:10px;
            padding:20px;
            transition: 0.3s;
        }
        .work-card:hover {
            box-shadow:0 4px 16px rgba(52,152,219,0.18);
        }
        .work-card a {
            color:#3498db;
            text-decoration:none;
        }
        footer {
            text-align:center;
            padding:30px;
            color:#666;
            font-size:0.9rem;
        }
    </style>
</head>
<body>
    <header>
         < img src="avatar.png" alt="头像" style="width:160px; border-radius:50%; margin-bottom:16px;">
        <h1>你好，我是王晨光</h1>
        <p>程序员｜网页作品｜学习记录</p >
    </header>
    <div class="container">
        <section>
            <h2>关于我</h2>
            <p>本人毕业于西安建筑科技大学。目前正在学习前端、Linux以及如何使用AI工具编写代码。</p >
        </section>
        <section>
            <h2>我的作品</h2>
            <div class="work-list">
                <div class="work-card">
                    <h3>网页小游戏</h3>
                    <p>自制简易网页游戏</p >
                    <a href=" ">查看项目</a >
                </div>
                <div class="work-card">
                    <h3>工具Demo</h3>
                    <p>前端小工具</p >
                    <a href="#">查看项目</a >
                </div>
            </div>
        </section>
        <section>
            <h2>联系方式</h2>
            <p>GitHub：<a href="https://aeiherumuh-luck.github.io/homepage/" target="_blank">我的个人主页</a ></p >
        </section>
    </div>
    <footer>
        © 2026 我的个人主页 | Powered by GitHub Pages
    </footer>
</body>
</html>
